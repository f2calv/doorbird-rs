name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: read
    with:
      tag-prefix: ''
      tag-and-release: false

  app:
    needs: versioning
    uses: f2calv/gha-workflows/.github/workflows/app-build-rust.yml@v1
    permissions:
      contents: read
    with:
      version: ${{ needs.versioning.outputs.version }}

  release:
    needs: [lint, versioning, app]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      tag-prefix: ''
      move-major-tag: false